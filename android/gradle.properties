# 拾光集安卓端 Gradle 配置
#
# 启动 Gradle 的 JVM（launcher）由环境变量 JAVA_HOME 决定，daemon/build JVM 由下面
# org.gradle.java.home 决定 —— 两个都要配，只配一个会出现「JVM 还是 25，构建报不兼容」。

# 本机存在 CIFS 挂载，Gradle 7.x 用 native 库枚举挂载表会抛 NullPointerException
# (FileSystemList.add)，关闭 vfs watch 绕过；命令侧还要带 --no-watch-fs
org.gradle.vfs.watch=false

# 本机可用内存约 5G：Gradle 2G + Kotlin daemon 1.5G 已是安全上限，不要照抄官方 5G+5G
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options="-Xmx1536m"

# 低配机构建：串行 + 限 worker，避免并发拉满内存
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.incremental=false

# Kotlin / Android 常规开关
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=false
kotlin.mpp.androidSourceSetLayoutVersion=2

# Kuikly：Android-only 工程也走本地 KSP 处理器（页面注册表由 KSP 生成）
kuikly.useLocalKsp=true

# JDK 路径不写在这里：这是要提交的共享配置，写死本机绝对路径会让别人 clone 后构建失败。
# 本机通过 GRADLE_USER_HOME/gradle.properties 的 org.gradle.java.home 指定，
# 或构建时用 JAVA_HOME 指向目标 JDK。
