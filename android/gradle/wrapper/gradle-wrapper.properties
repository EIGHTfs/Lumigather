# wrapper 发放地址：官方 services.gradle.org 会 307 跳到 downloads.gradle.org，本机访问该 CDN 读超时
# （实测 Read timed out，第一次用官方地址的构建在「下载 Gradle」这步就挂了）。
# 改走腾讯云镜像，同一文件秒级可取；换机器时若镜像不可用，再改回官方地址。
#
# Gradle 版本取 8.11.1：Kuikly 官方示例工程（miniApp/example/KuiklyWorkWithMiniapp）用的就是
# AGP 7.4.2 + Kotlin 2.1.21 + Gradle 8.11.1 这一组。最初照抄 KuiklyUI 源码仓库的 7.6.3 会失败：
# 7.6.3 内置 Kotlin 1.7.10 脚本编译器解析 Kotlin 2.1.21 编译的插件元数据时抛
# 「Protocol message contained an invalid tag (zero)」，配置 :app 阶段即中断。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
